name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html menu.html style.css site.js _site/
          cp -R assets menu _site/
          css_version=$(sha256sum _site/style.css | cut -c1-12)
          sed -i "s|style\.css\"|style.css?v=${css_version}\"|" _site/index.html _site/menu/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@v5
